# Template for running MacOS release jobs

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      displayed_name:
        type: string
        required: true
      head_sha:         # SHA of the commit to build. Defaults to the head of the triggering event (cf github doc.)
        type: string
        default: ''
      build_type:
        type: string
        default: 'Release'
      extra_cmake_flags:
        type: string
        default: ''
      artifact_version_suffix:  # Additional version string appended to 1.2.3+dev (for instance) in artifacts names
        type: string
        default: ''
    outputs:
      link:
        description: URL of the produced installer
        value: ${{ jobs.release-macos.outputs.link }}

jobs:
  release-macos:
    name: Create installer for ${{ inputs.displayed_name }}
    runs-on: ${{ inputs.runner }}
    outputs:
      link: ${{ steps.publish.outputs.artifact-url }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.head_sha }}
      - name: 'Install dependencies'
        uses: ./.github/actions/install_deps_mac
        with:
          install_path: $HOME
      - name: 'Build StudySzn Marker'
        uses: ./.github/actions/build
        with:
          build_type: ${{ inputs.build_type }}
          cmake_flags: >-
            -DCMAKE_INSTALL_PREFIX="$HOME/gtk/inst"
          extra_cmake_flags: ${{ inputs.extra_cmake_flags }}
      - name: 'Create installer'
        id: create-installer
        shell: bash
        run: |
          which pkg-config
          pkg-config --version
          (cd build && cmake --build . --target install)
          (cd mac-setup && ./build-app.sh $HOME/gtk)

          export VERSION="0.2.0"
          export OUTPUT="StudySzn-Marker-$VERSION${{ inputs.artifact_version_suffix }}-macOS-${{runner.arch}}.dmg"
          export ZIP_OUTPUT="StudySzn-Marker-$VERSION${{ inputs.artifact_version_suffix }}-macOS-${{runner.arch}}.zip"

          (cd mac-setup && ./build-dmg.sh "StudySzn Marker.app" "$OUTPUT")
          mv mac-setup/StudySzn-Marker.zip "mac-setup/$ZIP_OUTPUT"

          echo "dmg=$OUTPUT" >> $GITHUB_OUTPUT
          echo "zip=$ZIP_OUTPUT" >> $GITHUB_OUTPUT
      - name: 'Publish package'
        id: publish
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: "MacOS package ${{runner.os}}-${{runner.arch}}"
          compression-level: 0
          path: |
            ${{github.workspace}}/mac-setup/${{ steps.create-installer.outputs.dmg }}
            ${{github.workspace}}/mac-setup/${{ steps.create-installer.outputs.zip }}
          if-no-files-found: error
